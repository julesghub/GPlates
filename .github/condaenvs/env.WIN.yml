name: pygplates
channels:
  - conda-forge
  - defaults
dependencies:
  - numpy
  - cmake
  - ninja
  - scikit-build-core<0.11
  - cgal-cpp
  - gmp
  - mpfr
  - glew
  - qt-main
  - libboost-devel
  - libboost-python-devel
  - libgdal
  - proj
  - qwt
  - zlib
  # Windows does not need patchelf, mesalib, xorg-* packages
  # GL/GLX headers come bundled with the Windows SDK
